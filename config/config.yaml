artifacts_root: artifacts

data_ingestion:
  root_dir: artifacts/data_ingestion
  source_url: "https://raw.githubusercontent.com/krishnaik06/datasets/main/winequality-data.zip"
  local_data_file: artifacts/data_ingestion/data.zip
  unzip_dir: artifacts/data_ingestion

data_validation:
  root_dir: artifacts/data_validation
  STATUS_FILE: artifacts/data_validation/status.txt
  unzip_data_dir: artifacts/data_ingestion/winequality-red.csv



data_transformation:
   root_dir: artifacts/data_transformation
   data_path: artifacts/data_ingestion/winequality-red.csv

model_trainer:
   root_dir: artifacts/model_trainer
   train_data_path: artifacts/data_transformation/train.csv 
   test_data_path: artifacts/data_transformation/test.csv
   model_name: model.joblib

model_evaluation:
  root_dir: artifacts/model_evaluation                        # Folder for evaluation outputs (created by create_directories)
  test_data_path: artifacts/data_transformation/test.csv      # Test dataset from the transformation stage
  model_path: artifacts/model_trainer/model.joblib            # Trained model file from the training stage
  metric_file_name: artifacts/model_evaluation/metrics.json   # Where the metrics JSON is saved